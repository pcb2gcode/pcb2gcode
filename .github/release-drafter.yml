name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# Highest matching increment wins. A breaking title (feat!:, fix!:, ...) is
# major. A feature is minor. Everything else, including an unlabeled change,
# is a patch. The "Update release version" action writes this into
# CMakeLists.txt; the draft release stays unpublished until you publish it.
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch
categories:
  - type: version-resolver
    semver-increment: major
    when:
      conventional:
        breaking: true
  - title: '✨ Features'
    labels:
      - 'feature'
    semver-increment: minor
  - title: '🚀 Performance'
    labels:
      - 'performance'
  - title: '🪲 Bug Fixes'
    labels:
      - 'bug'
  - title: '🔨 Build'
    labels:
      - 'build'
  - title: '📘 Documentation'
    labels:
      - 'documentation'
  - title: '✅ Testing'
    labels:
      - 'testing'
      - 'ci'
  - title: '♻️ Refactoring'
    labels:
      - 'refactoring'
  - title: '🎨 Style'
    labels:
      - 'style'
  - title: '🧹 Chores'
    labels:
      - 'chore'
template: |
  ## What’s Changed

  $CHANGES
# Conventional Commits-style PR titles: <type>[(scope)][!]: <description>
# https://www.conventionalcommits.org/en/v1.0.0-beta.4/
autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\([^)]+\))?!?:/i'
      - '/^feature(\([^)]+\))?!?:/i'
      - '/^enhancement(\([^)]+\))?!?:/i'
  - label: 'performance'
    title:
      - '/^perf(\([^)]+\))?!?:/i'
      - '/^performance(\([^)]+\))?!?:/i'
  - label: 'bug'
    title:
      - '/^fix(\([^)]+\))?!?:/i'
      - '/^bugfix(\([^)]+\))?!?:/i'
      - '/^bug(\([^)]+\))?!?:/i'
  - label: 'build'
    title:
      - '/^build(\([^)]+\))?!?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\([^)]+\))?!?:/i'
      - '/^documentation(\([^)]+\))?!?:/i'
      - '/^doc(\([^)]+\))?!?:/i'
  - label: 'testing'
    title:
      - '/^tests(\([^)]+\))?!?:/i'
      - '/^test(\([^)]+\))?!?:/i'
      - '/^testing(\([^)]+\))?!?:/i'
  - label: 'ci'
    title:
      - '/^ci(\([^)]+\))?!?:/i'
  - label: 'refactoring'
    title:
      - '/^refactoring(\([^)]+\))?!?:/i'
      - '/^refactor(\([^)]+\))?!?:/i'
  - label: 'style'
    title:
      - '/^style(\([^)]+\))?!?:/i'
      - '/^whitespace(\([^)]+\))?!?:/i'
  - label: 'chore'
    title:
      - '/^chore(\([^)]+\))?!?:/i'
      - '/^chores(\([^)]+\))?!?:/i'
