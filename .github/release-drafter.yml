name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# Highest matching increment wins. A breaking title (feat!:, fix!:, ...) is
# major. A feature is minor. Everything else, including an unlabeled change,
# is a patch. The "Update release version" action writes this into
# CMakeLists.txt; the draft release stays unpublished until you publish it.
categories:
  # The version bump pull request carries this label so it stays out of the
  # notes and does not count as another patch.
  - type: pre-exclude
    when:
      label: 'skip-changelog'
  - type: version-resolver
    semver-increment: major
    when:
      conventional:
        breaking: true
  - type: version-resolver
    semver-increment: major
    when:
      label: 'major'
  - type: version-resolver
    semver-increment: minor
    when:
      label: 'minor'
  - type: version-resolver
    semver-increment: patch
    when:
      label: 'patch'
  # Fallback when no other version-resolver category matches.
  - type: version-resolver
    semver-increment: patch
  - title: '✨ Features'
    semver-increment: minor
    when:
      label: 'feature'
  - title: '🚀 Performance'
    when:
      label: 'performance'
  - title: '🪲 Bug Fixes'
    when:
      label: 'bug'
  - title: '🔨 Build'
    when:
      label: 'build'
  - title: '📘 Documentation'
    when:
      label: 'documentation'
  - title: '✅ Testing'
    when:
      labels:
        - 'testing'
        - 'ci'
  - title: '♻️ Refactoring'
    when:
      label: 'refactoring'
  - title: '🎨 Style'
    when:
      label: 'style'
  - title: '🧹 Chores'
    when:
      label: 'chore'
template: |
  ## What’s Changed

  $CHANGES
# Conventional Commits-style PR titles: <type>[(scope)][!]: <description>
# https://www.conventionalcommits.org/en/v1.0.0-beta.4/
autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\([^)]+\))?!?:/i'
      - '/^feature(\([^)]+\))?!?:/i'
      - '/^enhancement(\([^)]+\))?!?:/i'
  - label: 'performance'
    title:
      - '/^perf(\([^)]+\))?!?:/i'
      - '/^performance(\([^)]+\))?!?:/i'
  - label: 'bug'
    title:
      - '/^fix(\([^)]+\))?!?:/i'
      - '/^bugfix(\([^)]+\))?!?:/i'
      - '/^bug(\([^)]+\))?!?:/i'
  - label: 'build'
    title:
      - '/^build(\([^)]+\))?!?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\([^)]+\))?!?:/i'
      - '/^documentation(\([^)]+\))?!?:/i'
      - '/^doc(\([^)]+\))?!?:/i'
  - label: 'testing'
    title:
      - '/^tests(\([^)]+\))?!?:/i'
      - '/^test(\([^)]+\))?!?:/i'
      - '/^testing(\([^)]+\))?!?:/i'
  - label: 'ci'
    title:
      - '/^ci(\([^)]+\))?!?:/i'
  - label: 'refactoring'
    title:
      - '/^refactoring(\([^)]+\))?!?:/i'
      - '/^refactor(\([^)]+\))?!?:/i'
  - label: 'style'
    title:
      - '/^style(\([^)]+\))?!?:/i'
      - '/^whitespace(\([^)]+\))?!?:/i'
  - label: 'chore'
    title:
      - '/^chore(\([^)]+\))?!?:/i'
      - '/^chores(\([^)]+\))?!?:/i'
