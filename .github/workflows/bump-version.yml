name: Update release version

# Refreshes the calculated draft version, then opens a pull request that sets
# CMakeLists.txt VERSION. master is protected, so this workflow cannot push
# there. The draft stays unpublished. Publish it from the GitHub Releases page
# when the notes and archives look right.
on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Version component to bump'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
      - name: Read the draft version
        id: draft
        uses: release-drafter/release-drafter@v7
        with:
          # Read the calculated version without moving the draft tag. The tag
          # moves when the version pull request merges and master CI runs.
          dry-run: true
          publish: false
      - name: Choose the project version
        id: bump
        env:
          RESOLVED_VERSION: ${{ steps.draft.outputs.resolved_version }}
          RELEASE_BODY: ${{ steps.draft.outputs.body }}
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          python3 tools/bump_release_version.py \
            --part "${{ inputs.part }}" \
            --resolved-version "$RESOLVED_VERSION" \
            --last-tag "$last_tag" \
            --write
      - name: Open a pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release-version"
          git checkout -B "$branch"
          git add CMakeLists.txt
          git commit -m "chore: set version to ${VERSION}"
          if git fetch origin "$branch"; then
            git push --force-with-lease origin "HEAD:${branch}"
          else
            git push -u origin "HEAD:${branch}"
          fi
          gh label create skip-changelog \
            --description "Exclude from the draft release notes" \
            --color "ededed" \
            --force
          body="$(printf '%s\n' \
            "Set the project version to ${VERSION}." \
            "" \
            "\`master\` accepts this change only through a pull request. Merging it starts CI, which updates the draft release and replaces the Linux archives. Publish the draft from the Releases page when it looks right.")"
          title="chore: set version to ${VERSION}"
          existing="$(gh pr list --head "$branch" --base master --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body" --add-label skip-changelog
          else
            gh pr create --base master --head "$branch" --title "$title" --body "$body" --label skip-changelog
          fi
