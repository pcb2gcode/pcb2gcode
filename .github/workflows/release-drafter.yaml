name: Label Pull Requests

on:
  # pull_request_target event is required for autolabeler to support PRs from forks
  # edited is included so that fixing a PR title re-runs the autolabeler and the title check
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  label-pull-requests:
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the base branch, so this reads the
      # trusted release-drafter.yml and never runs code from the PR.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github

      # (Optional) GitHub Enterprise requires GHE_HOST variable set
      #- name: Set GHE_HOST
      #  run: |
      #    echo "GHE_HOST=${GITHUB_SERVER_URL##https:\/\/}" >> $GITHUB_ENV

      # Drafts your next Release notes as Pull Requests are merged into "master"
      - uses: release-drafter/release-drafter/autolabeler@v7
        # (Optional) specify config name to use, relative to .github/. Default: release-drafter.yml
        # with:
        #   config-name: my-config.yml

      # The autolabeler's title patterns are the source of truth for the
      # accepted prefixes. Read the type from each pattern, such as
      # /^feat(\([^)]+\))?!?:/i gives "feat".
      - name: Read accepted PR title types
        id: types
        run: |
          set -eu
          yq -r '.autolabeler[] | .title[]?' .github/release-drafter.yml > titles.txt
          test -s titles.txt
          if grep -v -E '^/\^[A-Za-z]+' titles.txt; then
            echo "::error::Cannot read a type from the title patterns above"
            exit 1
          fi
          types="$(sed -E 's#^/\^([A-Za-z]+).*#\1#' titles.txt | sort -u)"
          {
            echo "types<<TYPES_EOF"
            echo "$types"
            echo "TYPES_EOF"
          } >> "$GITHUB_OUTPUT"

      # The autolabeler silently skips PRs whose title doesn't match its
      # patterns, so fail here to make the author fix the title.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ steps.types.outputs.types }}
